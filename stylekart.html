<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vogify</title>
<link rel="manifest" href="/fashion-manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="/fashion-icon-192.png">
<link rel="icon" href="/fashion-icon-192.png">
<style>
:root{--bg:#fbf9f4;--card:#fff;--ink:#17130c;--mute:#7a6d55;--rose:#a87a1e;--on:#111;--soft:#f4ead3;--line:#e9e0cc;--gold:#f0cf85}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a07;--card:#17130c;--ink:#f6efdf;--mute:#b5a888;--rose:#e0b45a;--on:#e0b45a;--soft:#2a2113;--line:#33291a;--gold:#111}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
h1,h2,h3{font-family:"Avenir Next",Futura,system-ui,sans-serif;font-weight:800;letter-spacing:.2px;margin:0;color:var(--rose)}
header{padding:16px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px}header h1{font-size:22px;letter-spacing:.22em;line-height:1}.tag{font-size:9px;letter-spacing:.3em;color:var(--mute);margin-top:5px}
button,input,select{font:inherit}button{cursor:pointer}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}
.tab.on{background:var(--on);color:var(--gold);border-color:var(--on)}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{white-space:nowrap;padding:7px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink)}
.chip.on{background:var(--on);color:var(--gold);border-color:var(--on)}
.shop{display:flex;gap:12px;padding:14px;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.logo{flex:none;width:52px;height:52px;border-radius:50%;background:var(--on);color:var(--gold);display:grid;place-items:center;font:800 22px system-ui,sans-serif}
.shop h3{font-size:19px}.meta{font-size:13px;color:var(--mute)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--soft);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.ph{aspect-ratio:3/4;display:grid;place-items:center;font-size:48px;background:var(--soft);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.big{border-radius:14px;max-height:460px}
.prod .i{padding:10px}.price{color:var(--rose);font-weight:700}
.sold{position:absolute;top:8px;left:8px}
.pv{display:flex;gap:6px;margin:8px 0;overflow-x:auto}.pv img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.btns{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.btn{flex:1;min-width:90px;text-align:center;text-decoration:none;padding:12px;border-radius:10px;border:1px solid var(--rose);color:var(--rose);background:transparent;font-weight:600}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}.btn.pri{background:var(--on);border-color:var(--on);color:var(--gold)}
.btn[disabled]{opacity:.45}
.back{background:none;border:0;color:var(--rose);font-weight:600;padding:8px 0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row button{padding:6px 12px;border-radius:8px;border:1px solid var(--rose);background:none;color:var(--rose)}
.ord{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.ord .btns{margin:8px 0 0}.ord button.btn{background:none}
.empty{padding:24px 0;color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--on);color:var(--gold);padding:10px 18px;border-radius:20px;font-size:14px;max-width:90%;z-index:9}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><img src="/fashion-logo-mark.png" alt="" width="46" height="46"><div><h1>VOGIFY</h1><div class="tag">WEAR YOUR IDENTITY</div></div></div><div style="display:flex;gap:8px"><button class="chip" id="cartb" data-a="cart">🛒 0</button><button class="chip" id="auth">Sign in</button></div></header>
<div class="tabs" id="tabs"></div>
<main id="app"></main>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyBZ0kqTG5FFtM_PIZjVFn31HRtIuf7IjOs",authDomain:"jewel-nearby.firebaseapp.com",projectId:"jewel-nearby",storageBucket:"jewel-nearby.firebasestorage.app",messagingSenderId:"141846446703",appId:"1:141846446703:web:a1990707c90b3132b5039a"});
const auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const SH="fshops",PR="fproducts",OR="forders";
const CATS=["Shirts & Tops","Kurtas & Ethnic","Sarees","Dresses","Jeans & Trousers","Jackets","Footwear","Accessories","Other"];
const ST={placed:"Order placed",confirmed:"Confirmed by shop",ready:"Ready / shipped",completed:"Completed",cancelled:"Cancelled"};
const S={me:null,admin:false,mine:null,shops:[],pos:null,view:"home",f:"All",q:"",shop:null,prods:[],cat:"All",prod:null,size:"",img:0,photos:[],cart:[],orders:[],sorders:[]};
try{S.cart=JSON.parse(localStorage.getItem("jk.fcart")||"[]")}catch(e){}
const saveCart=()=>{try{localStorage.setItem("jk.fcart",JSON.stringify(S.cart))}catch(e){}};
const toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)};
const guard=async fn=>{try{await fn()}catch(e){console.error(e);toast(e.code==="permission-denied"?"Not allowed. Sign in first.":e.code==="auth/unauthorized-domain"?"Add this site to Firebase Authentication > Settings > Authorized domains":"Something went wrong. Try again.")}};
const docs=sn=>sn.docs.map(d=>({id:d.id,...d.data()}));
const val=i=>$(i).value.trim();
const disc=p=>p.mrp&&p.mrp>p.pr?Math.round((1-p.pr/p.mrp)*100):0;
const pic=(p,i)=>p.photos&&p.photos[i||0]?`<img src="${p.photos[i||0]}" alt="${esc(p.n)}">`:"👗";
const feeOf=(s,sub,dl)=>dl==="home"?((s.freeAbove&&sub>=s.freeAbove)?0:(s.delFee||0)):0;
const cartSub=()=>S.cart.reduce((a,i)=>a+i.pr*i.qty,0);
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.62))};im.onerror=rej;im.src=r.result};r.readAsDataURL(f)});
function dist(s){if(!S.pos||s.lat==null)return null;const r=x=>x*Math.PI/180,a=Math.sin(r(s.lat-S.pos.lat)/2)**2+Math.cos(r(S.pos.lat))*Math.cos(r(s.lat))*Math.sin(r(s.lng-S.pos.lng)/2)**2;return 12742*Math.asin(Math.sqrt(a))}

async function loadShops(){S.shops=docs(await getDocs(query(collection(db,SH),where("verified","==",true))))}
async function loadMine(){S.mine=null;if(!S.me)return;S.mine=docs(await getDocs(query(collection(db,SH),where("ownerId","==",S.me.uid))))[0]||null}
async function loadProds(id){S.prods=docs(await getDocs(query(collection(db,PR),where("shopId","==",id)))).sort((a,b)=>a.t-b.t)}
async function loadOrders(){S.orders=docs(await getDocs(query(collection(db,OR),where("userId","==",S.me.uid)))).sort((a,b)=>b.t-a.t)}
async function loadShopOrders(){S.sorders=docs(await getDocs(query(collection(db,OR),where("shopId","==",S.me.uid)))).sort((a,b)=>b.t-a.t)}

function tabs(){const t=[["home","Shops"],["orders","Orders"],["mine","My shop"]];if(S.admin)t.push(["admin","Admin"]);
 $("tabs").innerHTML=t.map(x=>`<button class="tab${(S.view===x[0]||(x[0]==="home"&&["shop","prod","cart","checkout"].includes(S.view)))?" on":""}" data-a="go" data-v="${x[0]}">${x[1]}</button>`).join("");
 $("auth").textContent=S.me?"Sign out":"Sign in";$("cartb").textContent="🛒 "+S.cart.reduce((a,i)=>a+i.qty,0)}

function home(){S.view="home";tabs();
 let l=S.shops.filter(s=>(S.f==="All"||(s.for||[]).includes(S.f))&&(!S.q||(s.name+" "+s.area).toLowerCase().includes(S.q.toLowerCase())));
 l=l.map(s=>({...s,d:dist(s)})).sort((a,b)=>S.pos?((a.d??1e9)-(b.d??1e9)):a.name.localeCompare(b.name));
 let h=`<input id="q" placeholder="Search store or area" value="${esc(S.q)}"><div class="chips">`+["All","Women","Men","Kids"].map(f=>`<button class="chip${S.f===f?" on":""}" data-a="f" data-f="${f}">${f}</button>`).join("")+`<button class="chip${S.pos?" on":""}" data-a="near">Near me</button></div>`;
 if(!l.length)h+=`<div class="empty">No verified stores yet. Store owners can register under “My shop”.</div>`;
 l.forEach(s=>h+=`<div class="shop" data-a="shop" data-id="${s.id}"><div class="logo">${esc(s.name[0])}</div><div><h3>${esc(s.name)}</h3><div class="meta">${esc(s.area)}${s.d!=null?" · "+s.d.toFixed(1)+" km":""} · ${esc(s.hours)}</div><div class="meta">${esc((s.for||[]).join(" · "))}</div><span class="badge">✔ Verified</span></div></div>`);
 $("app").innerHTML=h;$("q").oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;home();const n=$("q");n.focus();n.setSelectionRange(p,p)}}

function shopPg(){S.view="shop";tabs();const s=S.shop,cats=["All",...new Set(S.prods.map(p=>p.c))];
 let h=`<button class="back" data-a="go" data-v="home">← All stores</button><h2>${esc(s.name)}</h2><div class="meta">${esc(s.area)} · ${esc(s.hours)}</div><span class="badge">✔ Verified</span>
<div class="meta" style="margin-top:6px">${s.delFee?"Delivery "+inr(s.delFee)+(s.freeAbove?", free above "+inr(s.freeAbove):""):"Free delivery"}${s.policy?" · "+esc(s.policy):""}</div>
<div class="btns"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${esc(s.phone)}?text=${encodeURIComponent("Hi "+s.name+", I found you on Vogify.")}">WhatsApp</a><a class="btn" href="tel:+${esc(s.phone)}">Call</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${s.lat!=null?s.lat+","+s.lng:encodeURIComponent(s.name+" "+s.area)}">Directions</a></div>
<div class="chips">`+cats.map(c=>`<button class="chip${S.cat===c?" on":""}" data-a="cat" data-c="${esc(c)}">${esc(c)}</button>`).join("")+`</div><div class="grid">`;
 const v=S.prods.filter(p=>S.cat==="All"||p.c===S.cat);
 v.forEach(p=>{const d=disc(p);h+=`<div class="prod" data-a="prod" data-id="${p.id}"><div class="ph">${pic(p)}</div>${p.stock===false?'<span class="badge sold">Sold out</span>':""}<div class="i"><b>${esc(p.n)}</b><div class="meta">${esc(p.g)} · ${esc(p.c)}</div><div class="price">${inr(p.pr)} ${d?`<s class="meta">${inr(p.mrp)}</s> <span class="badge">${d}% off</span>`:""}</div></div></div>`});
 h+="</div>";if(!v.length)h+=`<div class="empty">No products here yet.</div>`;$("app").innerHTML=h}

function prodPg(){S.view="prod";const s=S.shop,p=S.prod,d=disc(p),sz=p.sz||[];
 let h=`<button class="back" data-a="shopback">← ${esc(s.name)}</button><div class="ph big">${pic(p,S.img)}</div>`;
 if((p.photos||[]).length>1)h+=`<div class="pv">`+p.photos.map((x,i)=>`<img src="${x}" alt="" data-a="img" data-i="${i}">`).join("")+`</div>`;
 h+=`<h2>${esc(p.n)}</h2><div class="meta">${esc(p.g)} · ${esc(p.c)} · ${esc(s.name)}</div><div class="price" style="font-size:22px;margin:6px 0">${inr(p.pr)} ${d?`<s class="meta">${inr(p.mrp)}</s> <span class="badge">${d}% off</span>`:""}</div><div class="meta">Inclusive of all taxes</div>`;
 if(sz.length)h+=`<label>Size</label><div class="chips">`+sz.map(z=>`<button class="chip${S.size===z?" on":""}" data-a="size" data-z="${esc(z)}">${esc(z)}</button>`).join("")+`</div>`;
 if(p.col)h+=`<div class="meta">Colour: ${esc(p.col)}</div>`;if(p.d)h+=`<p>${esc(p.d)}</p>`;
 h+=`<div class="meta">${s.policy?esc(s.policy)+" · ":""}${s.delFee?"Delivery "+inr(s.delFee)+(s.freeAbove?", free above "+inr(s.freeAbove):""):"Free delivery"}</div>
<div class="btns"><button class="btn pri" data-a="addcart" ${p.stock===false?"disabled":""}>${p.stock===false?"Sold out":"Add to cart"}</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${esc(s.phone)}?text=${encodeURIComponent("Hi, is "+p.n+(S.size?" in size "+S.size:"")+" available? Seen on Vogify.")}">Ask on WhatsApp</a></div>`;
 $("app").innerHTML=h}

function cartPg(){S.view="cart";tabs();
 if(!S.cart.length){$("app").innerHTML=`<h2>Your cart</h2><div class="empty">Your cart is empty.</div>`;return}
 let h=`<h2>Your cart</h2><div class="meta">${esc(S.cart[0].shopName)}</div>`;
 S.cart.forEach((i,k)=>h+=`<div class="row"><span>${esc(i.n)}<br><span class="meta">${i.size?"Size "+esc(i.size)+" · ":""}${inr(i.pr)}</span></span><span><button data-a="qty" data-k="${k}" data-d="-1">−</button> ${i.qty} <button data-a="qty" data-k="${k}" data-d="1">+</button> <button data-a="rmcart" data-k="${k}">✕</button></span></div>`);
 h+=`<div class="row"><b>Items total</b><b class="price">${inr(cartSub())}</b></div><div class="btns"><button class="btn pri" data-a="checkout">Checkout</button></div><div class="meta">Delivery charges are added at checkout.</div>`;$("app").innerHTML=h}

function checkoutPg(){S.view="checkout";tabs();
 const c=S.cart[0],s=S.shops.find(x=>x.id===c.shopId)||{},upi=s.upiId,sub=cartSub();
 $("app").innerHTML=`<h2>Checkout</h2><div class="meta">${esc(c.shopName)}${s.policy?" · "+esc(s.policy):""}</div>
<label>Your name</label><input id="cn" value="${esc(S.me.displayName||"")}"><label>Phone</label><input id="cp" type="tel" inputmode="numeric" placeholder="9812345678">
<label>Delivery</label><select id="cd"><option value="pickup">Pick up from store</option><option value="home">Home delivery</option></select><label>Address (for home delivery)</label><input id="ca">
<label>Payment</label><select id="cm"><option value="shop">Pay at store / on delivery</option>${upi?'<option value="upi">Pay now by UPI</option>':""}</select>
<div class="ord" id="sum"></div>
<div id="upibox" style="display:none"><div class="btns"><a class="btn" id="upil" href="#">Open UPI app</a></div><div class="meta">Pay to ${esc(upi||"")}. Then enter the 12-digit UPI reference (UTR) from your payment app.</div><label>UPI reference (UTR)</label><input id="cu" inputmode="numeric" maxlength="12"></div>
<div class="btns"><button class="btn pri" data-a="place">Place order</button></div><div class="meta">Your payment goes directly to the store. Vogify does not hold your money.</div>`;
 const upd=()=>{const f=feeOf(s,sub,$("cd").value),t=sub+f;$("sum").innerHTML=`Items ${inr(sub)}<br>Delivery ${f?inr(f):"Free"}<br><b class="price">Total ${inr(t)}</b>`;const u=$("upil");if(u&&upi){u.href=`upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(c.shopName)}&am=${t}&cu=INR&tn=${encodeURIComponent("Vogify order")}`;u.textContent="Open UPI app and pay "+inr(t)}};
 $("cd").onchange=upd;$("cm").onchange=()=>{$("upibox").style.display=$("cm").value==="upi"?"block":"none"};upd()}

function ordCard(o,shop){const code=o.id.slice(-6).toUpperCase(),b=[];
 const bt=(s,l)=>`<button class="btn" data-a="ost" data-id="${o.id}" data-s="${s}">${l}</button>`;
 if(shop){if(o.status==="placed")b.push(bt("confirmed","Confirm"));if(o.status==="confirmed")b.push(bt("ready","Mark ready / shipped"));if(o.status==="ready")b.push(bt("completed","Complete"));
  if(!o.paid&&o.status!=="cancelled")b.push(`<button class="btn" data-a="opaid" data-id="${o.id}">Payment received</button>`);
  if(o.status==="placed"||o.status==="confirmed")b.push(bt("cancelled","Cancel"))}
 else{if(o.status==="placed"&&!o.paid)b.push(bt("cancelled","Cancel order"));b.push(`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(o.shopPhone)}?text=${encodeURIComponent("Hi, about my Vogify order #"+code)}">Message store</a>`)}
 const pay=o.paid?"Paid ✔":o.method==="upi"?"UPI ref "+esc(o.utr)+" (store will confirm)":"Pay at store / on delivery";
 return `<div class="ord"><b>#${code}</b> · <span class="badge">${ST[o.status]||o.status}</span><div class="meta">${shop?esc(o.userName)+" · "+esc(o.userPhone):esc(o.shopName)} · ${new Date(o.t).toLocaleDateString("en-IN")}</div><div style="margin:6px 0">${o.items.map(i=>esc(i.n)+(i.size?" ("+esc(i.size)+")":"")+" × "+i.qty+" "+inr(i.line)).join("<br>")}</div><div class="meta">Delivery ${o.fee?inr(o.fee):"Free"}</div><div class="price">Total ${inr(o.total)}</div><div class="meta">${pay} · ${o.delivery==="home"?"Home delivery: "+esc(o.address):"Pickup from store"}</div><div class="btns">${b.join("")}</div></div>`}

async function ordersPg(){S.view="orders";tabs();
 if(!S.me){$("app").innerHTML=`<h2>My orders</h2><p>Sign in to see your orders.</p><div class="btns"><button class="btn pri" data-a="auth">Sign in with Google</button></div>`;return}
 await loadOrders();$("app").innerHTML=`<h2>My orders</h2>`+(S.orders.length?S.orders.map(o=>ordCard(o,false)).join(""):`<div class="empty">No orders yet.</div>`)}

async function mine(){S.view="mine";tabs();
 if(!S.me){$("app").innerHTML=`<h2>Store owners</h2><p>Sign in with Google to register your store and add products.</p><div class="btns"><button class="btn pri" data-a="auth">Sign in with Google</button></div>`;return}
 if(!S.mine){$("app").innerHTML=`<h2>Register your store</h2><label>Store name</label><input id="sn"><label>Area or locality</label><input id="sa"><label>WhatsApp number with country code</label><input id="sph" type="tel" inputmode="numeric" placeholder="919812345678"><label>Opening hours</label><input id="sh" placeholder="10am–9pm"><label>You sell for</label><select id="sf"><option>Women</option><option>Men</option><option>Kids</option><option>Women and Men</option><option>Everyone</option></select><label>UPI ID to receive payments (optional)</label><input id="supi" placeholder="storename@upi"><label>Delivery charge (₹, 0 for free)</label><input id="sdf" type="number" inputmode="numeric" value="0"><label>Free delivery above (₹, optional)</label><input id="sfa" type="number" inputmode="numeric"><label>Return / exchange policy (optional)</label><input id="spol" placeholder="7-day exchange with tags"><input id="slat" type="hidden"><input id="slng" type="hidden"><div class="btns"><button class="btn" data-a="loc" id="locb">Use store location (stand in your store)</button></div><div class="btns"><button class="btn pri" data-a="saveshop">Save store</button></div><div class="meta">New stores are shown to customers after the admin verifies them.</div>`;return}
 await loadProds(S.mine.id);await loadShopOrders();const s=S.mine;
 let h=`<h2>${esc(s.name)}</h2><div class="meta">${esc(s.area)}</div>${s.verified?'<span class="badge">✔ Verified, visible to customers</span>':'<span class="badge">Waiting for verification</span>'}
<h3 style="margin-top:18px">Orders (${S.sorders.length})</h3>${S.sorders.length?S.sorders.map(o=>ordCard(o,true)).join(""):'<div class="meta">No orders yet.</div>'}
<h3 style="margin-top:18px">Store settings</h3><label>UPI ID</label><input id="supi2" value="${esc(s.upiId||"")}"><label>Delivery charge (₹)</label><input id="sdf2" type="number" inputmode="numeric" value="${s.delFee||0}"><label>Free delivery above (₹)</label><input id="sfa2" type="number" inputmode="numeric" value="${s.freeAbove||""}"><label>Return / exchange policy</label><input id="spol2" value="${esc(s.policy||"")}"><div class="btns"><button class="btn" data-a="saveset">Save settings</button></div>
<h3 style="margin-top:18px">Add product</h3><label>Photos (up to 3)</label><input id="pf" type="file" accept="image/*" multiple><div class="pv" id="pv"></div>
<label>Product name</label><input id="on"><label>For</label><select id="og"><option>Women</option><option>Men</option><option>Kids</option><option>Unisex</option></select><label>Category</label><select id="oc">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
<label>Selling price (₹)</label><input id="opr" type="number" inputmode="decimal"><label>MRP (₹, optional, shows discount)</label><input id="omrp" type="number" inputmode="decimal"><label>Sizes (comma separated, optional)</label><input id="osz" placeholder="S, M, L, XL"><label>Colour (optional)</label><input id="ocol"><label>Short description (optional)</label><input id="od" maxlength="140">
<div class="btns"><button class="btn pri" data-a="saveprod">Save product</button></div><h3>Your products (${S.prods.length})</h3>`;
 S.prods.forEach(p=>h+=`<div class="row"><span>${esc(p.n)} · ${inr(p.pr)}${p.stock===false?" (sold out)":""}</span><span><button data-a="stock" data-id="${p.id}" data-s="${p.stock===false?1:0}">${p.stock===false?"In stock":"Sold out"}</button> <button data-a="delprod" data-id="${p.id}">Delete</button></span></div>`);
 $("app").innerHTML=h;
 $("pf").onchange=async e=>{try{S.photos=await Promise.all([...e.target.files].slice(0,3).map(shrink));$("pv").innerHTML=S.photos.map(x=>`<img src="${x}" alt="">`).join("")}catch(x){toast("Could not read a photo")}}}

async function adminPg(){S.view="admin";tabs();
 const all=docs(await getDocs(collection(db,SH)));
 let h=`<h2>Stores (${all.length})</h2>`;
 all.forEach(s=>h+=`<div class="row"><span>${esc(s.name)}<br><span class="meta">${esc(s.area)} · ${esc(s.phone)} · ${s.verified?"Verified":"Pending"}</span></span><button data-a="verify" data-id="${s.id}" data-v="${s.verified?0:1}">${s.verified?"Unverify":"Approve"}</button></div>`);
 if(!all.length)h+=`<div class="empty">No stores registered yet.</div>`;$("app").innerHTML=h}

const reOrders=()=>S.view==="orders"?ordersPg():mine();
const act={
 go:d=>guard(async()=>{if(d.v==="home"){await loadShops();home()}else if(d.v==="orders")await ordersPg();else if(d.v==="mine")await mine();else await adminPg()}),
 f:d=>{S.f=d.f;home()},
 near:()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{S.pos={lat:p.coords.latitude,lng:p.coords.longitude};home()},()=>toast("Allow location to sort by distance")):toast("Location not available"),
 shop:d=>guard(async()=>{S.shop=S.shops.find(s=>s.id===d.id);S.cat="All";await loadProds(d.id);shopPg()}),
 cat:d=>{S.cat=d.c;shopPg()},
 prod:d=>{S.prod=S.prods.find(p=>p.id===d.id);S.size="";S.img=0;prodPg()},
 size:d=>{S.size=d.z;prodPg()},img:d=>{S.img=+d.i;prodPg()},
 shopback:()=>shopPg(),auth:()=>$("auth").click(),cart:()=>cartPg(),
 loc:()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{$("slat").value=p.coords.latitude;$("slng").value=p.coords.longitude;$("locb").textContent="Location saved ✔"},()=>toast("Allow location to save it")):toast("Location not available"),
 saveshop:()=>guard(async()=>{const n=val("sn"),a=val("sa"),ph=val("sph").replace(/\D/g,"");if(!n||!a)return toast("Add store name and area");if(ph.length<10||ph.length>15)return toast("Enter number with country code");
  const f=$("sf").value,lat=val("slat"),lng=val("slng");
  await setDoc(doc(db,SH,S.me.uid),{name:n,area:a,phone:ph,hours:val("sh")||"Ask store",for:f==="Women and Men"?["Women","Men"]:f==="Everyone"?["Women","Men","Kids"]:[f],upiId:val("supi"),delFee:+val("sdf")||0,freeAbove:+val("sfa")||0,policy:val("spol"),lat:lat?+lat:null,lng:lng?+lng:null,ownerId:S.me.uid,verified:false,t:Date.now()});
  await loadMine();toast("Store saved. Add your products.");await mine()}),
 saveset:()=>guard(async()=>{await updateDoc(doc(db,SH,S.me.uid),{upiId:val("supi2"),delFee:+val("sdf2")||0,freeAbove:+val("sfa2")||0,policy:val("spol2")});await loadMine();toast("Settings saved")}),
 saveprod:()=>guard(async()=>{const n=val("on"),pr=+val("opr"),mrp=+val("omrp");if(!n||!(pr>0))return toast("Add a name and price");
  await addDoc(collection(db,PR),{shopId:S.me.uid,n,g:$("og").value,c:$("oc").value,pr,mrp:mrp>pr?mrp:0,sz:val("osz").split(",").map(x=>x.trim()).filter(Boolean).slice(0,12),col:val("ocol"),d:val("od"),photos:S.photos,stock:true,t:Date.now()});
  S.photos=[];toast("Product saved");await mine()}),
 stock:d=>guard(async()=>{await updateDoc(doc(db,PR,d.id),{stock:d.s==="1"});await mine()}),
 delprod:d=>guard(async()=>{if(!confirm("Delete this product?"))return;await deleteDoc(doc(db,PR,d.id));await mine()}),
 verify:d=>guard(async()=>{await updateDoc(doc(db,SH,d.id),{verified:d.v==="1"});await adminPg()}),
 addcart:()=>{const s=S.shop,p=S.prod;if(p.stock===false)return toast("Sold out");if((p.sz||[]).length&&!S.size)return toast("Choose a size first");
  if(S.cart.length&&S.cart[0].shopId!==s.id){if(!confirm("Your cart has items from another store. Clear it and add this?"))return;S.cart=[]}
  const k=p.id+"|"+(S.size||"-"),e=S.cart.find(i=>i.k===k);if(e)e.qty=Math.min(10,e.qty+1);else S.cart.push({k,id:p.id,shopId:s.id,shopName:s.name,shopPhone:s.phone,n:p.n,pr:p.pr,size:S.size,qty:1});
  saveCart();tabs();toast("Added to cart")},
 qty:d=>{const i=S.cart[+d.k];i.qty=Math.max(1,Math.min(10,i.qty+ +d.d));saveCart();cartPg()},
 rmcart:d=>{S.cart.splice(+d.k,1);saveCart();cartPg()},
 checkout:()=>{if(!S.me){toast("Sign in to continue");return $("auth").click()}guard(async()=>{if(!S.shops.length)await loadShops();checkoutPg()})},
 place:()=>guard(async()=>{const n=val("cn"),ph=val("cp").replace(/\D/g,""),m=$("cm").value,dl=$("cd").value,ad=val("ca"),utr=$("cu")?val("cu"):"";
  if(!n||ph.length<10)return toast("Add your name and phone");if(dl==="home"&&!ad)return toast("Add your delivery address");
  if(m==="upi"&&!/^\d{12}$/.test(utr))return toast("Enter the 12-digit UPI reference");
  const c=S.cart[0],s=S.shops.find(x=>x.id===c.shopId)||{},items=S.cart.map(i=>({n:i.n,size:i.size,qty:i.qty,unit:i.pr,line:i.pr*i.qty})),sub=cartSub(),fee=feeOf(s,sub,dl),total=sub+fee;
  if(!(total>0))return toast("Something is wrong with the cart");
  await addDoc(collection(db,OR),{userId:S.me.uid,userName:n,userPhone:ph,shopId:c.shopId,shopName:c.shopName,shopPhone:c.shopPhone,items,subtotal:sub,fee,total,method:m,utr:m==="upi"?utr:"",delivery:dl,address:ad,status:"placed",paid:false,t:Date.now(),updatedAt:Date.now()});
  S.cart=[];saveCart();toast("Order placed");await ordersPg()}),
 ost:d=>guard(async()=>{await updateDoc(doc(db,OR,d.id),{status:d.s,updatedAt:Date.now()});await reOrders()}),
 opaid:d=>guard(async()=>{await updateDoc(doc(db,OR,d.id),{paid:true,updatedAt:Date.now()});await reOrders()})
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&act[t.dataset.a])act[t.dataset.a](t.dataset)});
$("auth").onclick=()=>guard(async()=>{S.me?await signOut(auth):await signInWithPopup(auth,new GoogleAuthProvider())});
onAuthStateChanged(auth,async u=>{S.me=u;S.admin=false;S.mine=null;
 if(u){try{await getDoc(doc(db,"admin","ping"));S.admin=true}catch(e){}try{await loadMine()}catch(e){}}
 tabs();if(["mine","admin","orders"].includes(S.view)){await act.go({v:S.view==="admin"?"mine":S.view})}else if(S.view==="home")home()});
guard(async()=>{await loadShops();home()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/fashion-sw.js").catch(()=>{});
</script>
</body>
</html>
